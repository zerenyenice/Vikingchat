# Render Blueprint: https://render.com/docs/blueprint-spec
# One Docker service running Vikingchat + embedded OpenViking + the agent.
# No persistent disk: chats, memories and documents live in the container's
# filesystem and reset on every deploy or restart (fine for testing). To keep
# them, add a disk mounted at /app/.openviking on a paid plan.
services:
  - type: web
    name: vikingchat
    runtime: docker
    plan: standard           # 2 GB RAM: OpenViking + the Python agent + Node do not fit in 512 MB
    branch: claude/mobile-ui-testing-setup-tv9utr
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        value: gpt-5.1
      - key: AZURE_OPENAI_PROCESSING_DEPLOYMENT
        value: gpt-5.4-mini
      - key: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
        value: text-embedding-3-large
      - key: OPENVIKING_WITH_BOT
        value: "0"
