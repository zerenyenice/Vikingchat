[project]
name = "vikingchat-backend"
version = "0.1.0"
description = "Agent chat backend: LangChain Deep Agents + OpenViking context database"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "PyJWT>=2.8",
  "deepagents>=0.7",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-anthropic>=1.0",
  "langchain-openai>=1.0",
  "openviking-sdk>=0.1.11",
  "langchain-openviking>=0.1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
