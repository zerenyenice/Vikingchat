<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vikingchat</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root {
    --bg: #F3EFE6; --surface: #FFFFFF; --surface-2: #E9E3D6; --ink: #1B2430; --muted: #66707F;
    --line: #D9D2C3; --accent: #B4502E; --accent-ink: #FFF7F2; --sea: #2B6777;
    --ok: #2F7D4F; --warn: #A9741A; --bad: #A63A2B;
    --shadow: 0 1px 2px rgba(27,36,48,.08), 0 6px 20px -12px rgba(27,36,48,.25);
    --scrim: rgba(27,36,48,.45);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1720; --surface: #182330; --surface-2: #1F2C3B; --ink: #E8E4DA; --muted: #8B96A5;
      --line: #2A3847; --accent: #E0704A; --accent-ink: #1B120E; --sea: #6FB3C4;
      --ok: #6BC28C; --warn: #E0B25A; --bad: #E67F70;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px -12px rgba(0,0,0,.6); --scrim: rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1720; --surface: #182330; --surface-2: #1F2C3B; --ink: #E8E4DA; --muted: #8B96A5;
    --line: #2A3847; --accent: #E0704A; --accent-ink: #1B120E; --sea: #6FB3C4;
    --ok: #6BC28C; --warn: #E0B25A; --bad: #E67F70;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px -12px rgba(0,0,0,.6); --scrim: rgba(0,0,0,.6);
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-text-size-adjust: 100%; }
  * { box-sizing: border-box; }
  button, textarea, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  .app { height: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); position: relative; }

  /* Header */
  .top { position: sticky; top: env(safe-area-inset-top, 0px); display: flex; align-items: center; gap: 10px;
    padding: 10px 12px 10px 8px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); z-index: 2; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--ink);
    display: grid; place-items: center; flex: none; }
  .icon-btn:active { background: var(--surface-2); }
  .icon-btn svg { width: 22px; height: 22px; }
  .brand { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  .brand svg { width: 28px; height: 28px; flex: none; }
  .brand h1 { margin: 0; font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 21px; letter-spacing: -0.01em; line-height: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; letter-spacing: .02em; color: var(--muted);
    padding: 4px 10px; border-radius: 999px; background: var(--surface-2); white-space: nowrap; max-width: 46%; overflow: hidden; text-overflow: ellipsis; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .status[data-state="live"] .dot { background: var(--ok); }
  .status[data-state="preview"] .dot { background: var(--warn); }
  .status[data-state="error"] .dot { background: var(--bad); }

  /* Messages */
  .log { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
  .msg { display: flex; flex-direction: column; max-width: 86%; gap: 4px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .bubble { padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: var(--shadow); }
  .user .bubble { background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 6px; }
  .assistant .bubble { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .msg.error .bubble { border-color: var(--bad); color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, var(--surface)); }
  .meta { font-size: 11px; color: var(--muted); padding: 0 6px; font-variant-numeric: tabular-nums; }
  .sources { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 4px; }
  .sources span { font-size: 11px; color: var(--sea); border: 1px solid color-mix(in srgb, var(--sea) 40%, transparent); border-radius: 999px; padding: 1px 8px; }
  .sources span.mem { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .typing { display: inline-flex; gap: 4px; align-items: center; height: 1.5em; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }

  .banner { margin: 0 16px 8px; padding: 10px 12px; border-radius: 10px; font-size: 13px; background: var(--surface-2); color: var(--ink); border-left: 3px solid var(--warn); }
  .banner[data-kind="error"] { border-left-color: var(--bad); }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 14px; }
  .chip:active { background: var(--surface-2); }

  /* Uploads strip */
  .uploads { display: flex; flex-direction: column; gap: 6px; padding: 0 16px 6px; }
  .upload { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 8px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
  .upload .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .upload .state { color: var(--muted); white-space: nowrap; }
  .upload[data-state="completed"] .state { color: var(--ok); }
  .upload[data-state="error"] .state { color: var(--bad); }

  /* Composer */
  .composer { display: flex; align-items: flex-end; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--bg); }
  .composer textarea { flex: 1; resize: none; min-height: 44px; max-height: 160px; padding: 10px 14px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); line-height: 1.4; outline: none; }
  .composer textarea:focus { border-color: var(--sea); box-shadow: 0 0 0 3px color-mix(in srgb, var(--sea) 25%, transparent); }
  .send { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
  .send:disabled { opacity: .45; cursor: default; }
  .send svg { width: 20px; height: 20px; }
  .ghost { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; }
  .ghost svg { width: 18px; height: 18px; }
  .ghost:disabled { opacity: .45; cursor: default; }

  /* Drawer */
  .scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 5; }
  .drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(340px, 88vw); background: var(--bg); z-index: 6;
    display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,0,0,.35);
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .drawer-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px 16px; }
  .drawer-head h2 { margin: 0; font-family: "Fraunces", Georgia, serif; font-size: 18px; flex: 1; }
  .newchat { display: flex; align-items: center; gap: 8px; margin: 0 12px 8px; padding: 10px 14px; border-radius: 12px; border: 0;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .newchat svg { width: 18px; height: 18px; }
  .tabs { display: flex; gap: 4px; padding: 0 12px 8px; }
  .tab { flex: 1; padding: 8px 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; color: var(--muted); }
  .tab[aria-selected="true"] { background: var(--surface-2); color: var(--ink); font-weight: 700; border-color: transparent; }
  .panel { flex: 1; overflow-y: auto; padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
  .empty { color: var(--muted); font-size: 14px; padding: 16px 6px; text-align: center; }
  .row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); text-align: left; width: 100%; }
  .row.active { border-color: var(--accent); }
  .row .body { flex: 1; min-width: 0; }
  .row .title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
  .row .sub { display: block; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row .del { width: 32px; height: 32px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; flex: none; }
  .row .del svg { width: 16px; height: 16px; }
  .memory-item { padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; }
  .memory-item .cat { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--sea); display: block; margin-bottom: 4px; }
  .memory-item p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .drawer .upload-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border-radius: 12px; border: 1px dashed var(--line); background: transparent; color: var(--sea); }
  .drawer .upload-btn svg { width: 18px; height: 18px; }
  .hint { font-size: 12px; color: var(--muted); padding: 0 6px 4px; }

  :is(button, textarea, .chip, .row):focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .log { scroll-behavior: auto; } .typing i { animation: none; opacity: .6; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="icon-btn" id="menu" type="button" aria-label="Chats and documents">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M4 20c3 4 7 6 12 6s9-2 12-6" fill="none" stroke="var(--sea)" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M8 20V10l8-6 8 6v10" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M16 4v16" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <h1 id="title">Vikingchat</h1>
    </div>
    <div class="status" id="status" data-state="checking"><span class="dot"></span><span id="statusText">Connecting…</span></div>
  </header>

  <main class="log" id="log" aria-live="polite" aria-label="Conversation"></main>
  <div class="banner" id="banner" hidden></div>

  <nav class="chips" id="chips" aria-label="Suggested prompts">
    <button class="chip" type="button" data-prompt="Tell me a short Viking saga in three sentences.">Short saga</button>
    <button class="chip" type="button" data-prompt="What do you remember about me?">What do you remember?</button>
    <button class="chip" type="button" data-prompt="Summarize the documents I uploaded.">Summarize my documents</button>
    <button class="chip" type="button" data-prompt="Give me three Old Norse words and what they mean.">Old Norse words</button>
  </nav>

  <div class="uploads" id="uploads"></div>

  <form class="composer" id="composer">
    <button class="ghost" type="button" id="attach" title="Upload a document" aria-label="Upload a document">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.2-9.19a4 4 0 0 1 5.65 5.66l-9.2 9.19a2 2 0 0 1-2.82-2.83l8.49-8.48"/></svg>
    </button>
    <input type="file" id="file" hidden accept=".pdf,.doc,.docx,.md,.txt,.html,.htm,.csv,.xlsx,.xls,.pptx,.ppt,.epub,.json">
    <textarea id="input" rows="1" placeholder="Message Vikingchat…" autocomplete="off" enterkeyhint="send" aria-label="Message"></textarea>
    <button class="send" type="submit" id="send" aria-label="Send" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
    </button>
  </form>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="Chats, documents and memory">
    <div class="drawer-head">
      <h2>Vikingchat</h2>
      <button class="icon-btn" id="closeDrawer" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <button class="newchat" id="newChat" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-chats" aria-selected="true" data-panel="chats" type="button">Chats</button>
      <button class="tab" role="tab" id="tab-docs" aria-selected="false" data-panel="docs" type="button">Documents</button>
      <button class="tab" role="tab" id="tab-memory" aria-selected="false" data-panel="memory" type="button">Memory</button>
    </div>
    <div class="panel" id="panel-chats" role="tabpanel"></div>
    <div class="panel" id="panel-docs" role="tabpanel" hidden></div>
    <div class="panel" id="panel-memory" role="tabpanel" hidden></div>
  </aside>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("input"), send = $("send"), form = $("composer"), status = $("status"),
        statusText = $("statusText"), banner = $("banner"), chips = $("chips"), titleEl = $("title"),
        drawer = $("drawer"), scrim = $("scrim"), uploadsEl = $("uploads"), fileInput = $("file");

  let mode = "checking";           // live | preview | error
  let ovReady = false;
  let busy = false;
  let chats = [];                  // [{id,title,updatedAt,messageCount}]
  let current = null;              // {id,title,messages:[]}
  const previewStore = new Map();  // preview mode: chats kept in the page only

  // ---- status -------------------------------------------------------------
  function setStatus(state, text) { mode = state; status.dataset.state = state; statusText.textContent = text; }
  function showBanner(text, kind) { banner.textContent = text; banner.dataset.kind = kind || "info"; banner.hidden = !text; }

  async function api(path, opts = {}) {
    const r = await fetch(path, { cache: "no-store", ...opts, headers: { ...(opts.body && !(opts.body instanceof FormData) ? { "Content-Type": "application/json" } : {}), ...(opts.headers || {}) } });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
    return data;
  }

  async function checkHealth() {
    try {
      const h = await api("/api/health");
      ovReady = Boolean(h.openviking?.ready);
      if (h.configured) {
        const agentOn = Boolean(h.agent?.ready);
        setStatus("live", `${h.deployment}${agentOn ? " · agent" : ""}${ovReady ? " · memory on" : " · memory off"}`);
        showBanner(ovReady ? "" : h.openviking?.enabled
          ? `Memory and documents are unavailable right now: OpenViking is ${h.openviking?.detail || "not ready"}. Chat still works. Details: /api/diagnostics`
          : "Memory and documents are off: OpenViking is not configured on the server.");
      } else {
        setStatus("error", "Not configured");
        showBanner("The server is running but has no Azure OpenAI endpoint or api key set. Add them to the environment and restart.", "error");
      }
      return true;
    } catch {
      setStatus("preview", "Preview mode");
      showBanner("Preview mode: this page is not connected to a server, so replies are simulated and nothing is saved. Layout and controls are the real thing.");
      return false;
    }
  }

  // ---- rendering ----------------------------------------------------------
  const timeLabel = (ts) => new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const dateLabel = (ts) => { const d = new Date(ts), now = new Date();
    return d.toDateString() === now.toDateString() ? timeLabel(ts) : d.toLocaleDateString([], { month: "short", day: "numeric" }); };

  function renderMessage(m) {
    const el = document.createElement("div");
    el.className = `msg ${m.role}${m.error ? " error" : ""}`;
    const b = document.createElement("div"); b.className = "bubble"; b.textContent = m.content;
    el.append(b);
    if (m.sources?.length || m.memoryUpdated) {
      const s = document.createElement("div"); s.className = "sources";
      if (m.memoryUpdated) { const t = document.createElement("span"); t.className = "mem"; t.textContent = "Memory updated"; s.append(t); }
      for (const src of m.sources || []) { const t = document.createElement("span"); t.textContent = src.name; s.append(t); }
      el.append(s);
    }
    const meta = document.createElement("div"); meta.className = "meta";
    meta.textContent = (m.role === "user" ? "You" : "Vikingchat") + " · " + timeLabel(m.ts || Date.now());
    el.append(meta);
    return el;
  }
  function renderConversation() {
    log.replaceChildren();
    const msgs = current?.messages ?? [];
    if (msgs.length === 0) {
      log.append(renderMessage({ role: "assistant", ts: Date.now(), content: "Heil og sæl! I’m Vikingchat. I remember what you tell me across chats, and I can read documents you upload with the paperclip." }));
    }
    for (const m of msgs) log.append(renderMessage(m));
    chips.hidden = msgs.length > 0;
    titleEl.textContent = current && msgs.length ? current.title : "Vikingchat";
    scrollToEnd();
  }
  function scrollToEnd() { log.scrollTop = log.scrollHeight; }
  function showTyping() {
    const el = document.createElement("div"); el.className = "msg assistant"; el.id = "typing";
    const b = document.createElement("div"); b.className = "bubble"; b.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    el.append(b); log.append(el); scrollToEnd();
  }
  function hideTyping() { document.getElementById("typing")?.remove(); }

  // ---- chats --------------------------------------------------------------
  async function refreshChats() {
    if (mode === "preview") { chats = [...previewStore.values()].map((c) => ({ id: c.id, title: c.title, updatedAt: c.updatedAt, messageCount: c.messages.length })).sort((a, b) => b.updatedAt - a.updatedAt); }
    else { try { chats = (await api("/api/chats")).chats; } catch { chats = []; } }
    renderChatList();
  }
  function renderChatList() {
    const panel = $("panel-chats"); panel.replaceChildren();
    if (!chats.length) { const e = document.createElement("div"); e.className = "empty"; e.textContent = "No chats yet. Start one below."; panel.append(e); return; }
    for (const c of chats) {
      const row = document.createElement("div"); row.className = "row" + (current?.id === c.id ? " active" : ""); row.setAttribute("role", "button"); row.tabIndex = 0;
      const body = document.createElement("div"); body.className = "body";
      const t = document.createElement("span"); t.className = "title"; t.textContent = c.title || "New chat";
      const s = document.createElement("span"); s.className = "sub"; s.textContent = `${c.messageCount || 0} messages · ${dateLabel(c.updatedAt)}`;
      body.append(t, s);
      const del = document.createElement("button"); del.className = "del"; del.type = "button"; del.title = "Delete chat"; del.setAttribute("aria-label", "Delete chat");
      del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
      del.addEventListener("click", async (e) => { e.stopPropagation(); if (!confirm(`Delete “${c.title}”?`)) return; await deleteChat(c.id); });
      row.append(body, del);
      const open = () => { openChat(c.id); closeDrawer(); };
      row.addEventListener("click", open);
      row.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
      panel.append(row);
    }
  }
  async function openChat(id) {
    if (mode === "preview") current = previewStore.get(id) || null;
    else { try { current = (await api(`/api/chats/${id}`)).chat; } catch { current = null; } }
    try { localStorage.setItem("vikingchat.current", current?.id || ""); } catch {}
    renderConversation(); renderChatList();
  }
  async function newChat() {
    if (mode === "preview") { current = { id: String(Date.now()), title: "New chat", createdAt: Date.now(), updatedAt: Date.now(), messages: [] }; previewStore.set(current.id, current); }
    else { current = (await api("/api/chats", { method: "POST" })).chat; }
    try { localStorage.setItem("vikingchat.current", current.id); } catch {}
    await refreshChats(); renderConversation(); closeDrawer(); input.focus();
  }
  async function deleteChat(id) {
    if (mode === "preview") previewStore.delete(id); else await api(`/api/chats/${id}`, { method: "DELETE" });
    if (current?.id === id) { current = null; renderConversation(); }
    await refreshChats();
  }

  // ---- sending ------------------------------------------------------------
  function simulateReply(text) {
    const canned = [
      "This is a simulated reply so you can check the layout on your phone. On the real server, this answer comes from Azure OpenAI with your memories and documents as context.",
      "Skál! In preview mode I only echo. You asked: “" + text.slice(0, 120) + (text.length > 120 ? "…" : "") + "”",
      "Longer replies wrap like this so you can see how multi-line bubbles behave on a narrow screen.\n\nA second paragraph keeps its spacing, and very long words such as Hávamálstrophenverzeichnis break instead of overflowing.",
    ];
    return new Promise((res) => setTimeout(() => res(canned[(text.length + (current?.messages.length || 0)) % canned.length]), 700 + Math.random() * 600));
  }

  async function submit(text) {
    text = text.trim();
    if (!text || busy) return;
    busy = true; send.disabled = true; chips.hidden = true;
    try {
      if (!current) {
        if (mode === "preview") { current = { id: String(Date.now()), title: "New chat", createdAt: Date.now(), updatedAt: Date.now(), messages: [] }; previewStore.set(current.id, current); }
        else current = (await api("/api/chats", { method: "POST" })).chat;
        try { localStorage.setItem("vikingchat.current", current.id); } catch {}
      }
      const userMsg = { role: "user", content: text, ts: Date.now() };
      current.messages.push(userMsg);
      if (current.messages.length === 1) { current.title = text.slice(0, 48); titleEl.textContent = current.title; }
      log.querySelector(".msg")?.parentElement === log && current.messages.length === 1 && log.replaceChildren();
      log.append(renderMessage(userMsg));
      input.value = ""; autosize(); showTyping();

      let reply;
      if (mode === "preview") {
        reply = { role: "assistant", content: await simulateReply(text), ts: Date.now() };
        current.updatedAt = Date.now();
      } else {
        const r = await api(`/api/chats/${current.id}/messages`, { method: "POST", body: JSON.stringify({ content: text }) });
        reply = r.message; current.title = r.chat.title; current.updatedAt = r.chat.updatedAt;
        if (r.usedMemories) statusText.textContent = statusText.textContent.replace(/ · used .*$/, "") + ` · used ${r.usedMemories} memor${r.usedMemories === 1 ? "y" : "ies"}`;
      }
      hideTyping();
      current.messages.push(reply);
      log.append(renderMessage(reply));
      titleEl.textContent = current.title;
      refreshChats();
    } catch (err) {
      hideTyping();
      log.append(renderMessage({ role: "assistant", error: true, ts: Date.now(), content: "Couldn’t get a reply: " + err.message }));
    } finally {
      busy = false; send.disabled = !input.value.trim(); scrollToEnd(); input.focus();
    }
  }

  // ---- documents ----------------------------------------------------------
  const fmtSize = (n) => n == null ? "" : n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(0)} KB` : `${(n / 1048576).toFixed(1)} MB`;

  async function refreshDocs() {
    const panel = $("panel-docs"); panel.replaceChildren();
    const up = document.createElement("button"); up.className = "upload-btn"; up.type = "button";
    up.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0 -4 4m4-4 4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg> Upload a document';
    up.addEventListener("click", () => fileInput.click());
    panel.append(up);
    const hint = document.createElement("div"); hint.className = "hint"; hint.textContent = "PDF, Word, PowerPoint, Excel, Markdown, text or HTML, up to 10 MB. Documents are stored under viking://resources/uploads and searched on every message.";
    panel.append(hint);
    if (mode === "preview" || !ovReady) { const e = document.createElement("div"); e.className = "empty"; e.textContent = mode === "preview" ? "Connect a server to upload documents." : "OpenViking is not reachable right now."; panel.append(e); return; }
    let docs = [];
    try { docs = (await api("/api/documents")).documents; } catch (err) { const e = document.createElement("div"); e.className = "empty"; e.textContent = err.message; panel.append(e); return; }
    if (!docs.length) { const e = document.createElement("div"); e.className = "empty"; e.textContent = "No documents yet."; panel.append(e); return; }
    for (const d of docs) {
      const row = document.createElement("div"); row.className = "row";
      const body = document.createElement("div"); body.className = "body";
      const t = document.createElement("span"); t.className = "title"; t.textContent = d.name;
      const s = document.createElement("span"); s.className = "sub"; s.textContent = [d.modified ? dateLabel(Date.parse(d.modified) || Date.now()) : "", d.isDir ? "" : fmtSize(d.size)].filter(Boolean).join(" · ") || "indexed";
      body.append(t, s);
      const del = document.createElement("button"); del.className = "del"; del.type = "button"; del.title = "Delete document"; del.setAttribute("aria-label", "Delete document");
      del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
      del.addEventListener("click", async () => { if (!confirm(`Delete “${d.name}” from your documents?`)) return;
        try { await api(`/api/documents?uri=${encodeURIComponent(d.uri)}`, { method: "DELETE" }); } catch (err) { alert(err.message); } refreshDocs(); });
      row.append(body, del); panel.append(row);
    }
  }

  async function uploadFile(file) {
    if (mode === "preview") { alert("Uploads need the real server. This page is in preview mode."); return; }
    const item = document.createElement("div"); item.className = "upload"; item.dataset.state = "uploading";
    item.innerHTML = `<span class="name"></span><span class="state">Uploading…</span>`;
    item.querySelector(".name").textContent = file.name; uploadsEl.append(item);
    const setState = (s, label) => { item.dataset.state = s; item.querySelector(".state").textContent = label; };
    try {
      const fd = new FormData(); fd.append("file", file, file.name);
      const r = await api("/api/documents", { method: "POST", body: fd });
      setState("processing", "Processing…");
      const started = Date.now();
      while (Date.now() - started < 15 * 60_000) {
        await new Promise((res) => setTimeout(res, 3000));
        const t = await api(`/api/documents/tasks/${r.taskId}`);
        if (t.status === "completed") { setState("completed", "Ready"); break; }
        if (t.status === "error" || t.status === "failed") { setState("error", t.error || "Failed"); break; }
      }
      refreshDocs();
      setTimeout(() => item.remove(), 6000);
    } catch (err) { setState("error", err.message); setTimeout(() => item.remove(), 12000); }
  }

  // ---- memory -------------------------------------------------------------
  async function refreshMemory() {
    const panel = $("panel-memory"); panel.replaceChildren();
    const hint = document.createElement("div"); hint.className = "hint"; hint.textContent = "What Vikingchat has learned about you. The agent decides itself what to remember and writes these files during the conversation.";
    panel.append(hint);
    if (mode === "preview" || !ovReady) { const e = document.createElement("div"); e.className = "empty"; e.textContent = mode === "preview" ? "Connect a server to see memories." : "OpenViking is not reachable right now."; panel.append(e); return; }
    let mem;
    try { mem = await api("/api/memory"); } catch (err) { const e = document.createElement("div"); e.className = "empty"; e.textContent = err.message; panel.append(e); return; }
    if (!mem.items?.length) { const e = document.createElement("div"); e.className = "empty"; e.textContent = "Nothing remembered yet. Chat a little, then check back in a couple of minutes."; panel.append(e); return; }
    for (const it of mem.items) {
      const el = document.createElement("div"); el.className = "memory-item";
      const c = document.createElement("span"); c.className = "cat"; c.textContent = it.category || "memory";
      const p = document.createElement("p"); p.textContent = it.text;
      el.append(c, p); panel.append(el);
    }
  }

  // ---- drawer -------------------------------------------------------------
  function openDrawer() { drawer.hidden = false; scrim.hidden = false; refreshChats(); }
  function closeDrawer() { drawer.hidden = true; scrim.hidden = true; }
  function selectTab(name) {
    for (const t of document.querySelectorAll(".tab")) t.setAttribute("aria-selected", String(t.dataset.panel === name));
    for (const p of ["chats", "docs", "memory"]) $(`panel-${p}`).hidden = p !== name;
    if (name === "docs") refreshDocs(); if (name === "memory") refreshMemory(); if (name === "chats") refreshChats();
  }
  $("menu").addEventListener("click", openDrawer);
  $("closeDrawer").addEventListener("click", closeDrawer);
  scrim.addEventListener("click", closeDrawer);
  $("newChat").addEventListener("click", newChat);
  document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => selectTab(t.dataset.panel)));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !drawer.hidden) closeDrawer(); });

  // ---- composer -----------------------------------------------------------
  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }
  input.addEventListener("input", () => { autosize(); send.disabled = !input.value.trim() || busy; });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(input.value); } });
  form.addEventListener("submit", (e) => { e.preventDefault(); submit(input.value); });
  chips.addEventListener("click", (e) => { const chip = e.target.closest(".chip"); if (chip) submit(chip.dataset.prompt); });
  $("attach").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => { const f = fileInput.files?.[0]; if (f) uploadFile(f); fileInput.value = ""; });

  // ---- boot ---------------------------------------------------------------
  (async () => {
    const live = await checkHealth();
    if (live) {
      await refreshChats();
      let last = ""; try { last = localStorage.getItem("vikingchat.current") || ""; } catch {}
      if (last && chats.some((c) => c.id === last)) await openChat(last);
      else if (chats.length) await openChat(chats[0].id);
      else renderConversation();
      setInterval(checkHealth, 30_000);
    } else renderConversation();
  })();
})();
</script>
</body>
</html>
